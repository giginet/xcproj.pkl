name: Pkl tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pkl
      - name: Test the public Pkl API
        run: pkl test Pkl/xcproj/tests/ApiTests.pkl
      - name: Prepare release artifacts without publishing
        run: bash Scripts/prepare-pkl-release.sh pkl/0.1.0 --output-path "$RUNNER_TEMP/pkl-release"
