name: swift-format

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    container: swift:6.4.2-noble
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check all tracked Swift files
        shell: bash
        run: |
          # The container runs as a different user than the checkout owner.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files -z '*.swift' | xargs -0 swift format lint --configuration .swift-format --strict
