name: Build and test xcprojgen

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pkl
        with:
          version: '0.33.0'
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build xcprojgen
        run: swift build --product xcprojgen
      - name: Run all Swift tests, including those that evaluate Pkl
        run: swift test
      - name: Check CLI release packaging and formula generation without publishing
        run: |
          python3 -m unittest discover -s Scripts/tests
          bash Scripts/prepare-cli-release.sh 1.2.3 --output-path "$RUNNER_TEMP/cli-release"
          python3 Scripts/update-homebrew-formula.py 1.2.3 \
            "$RUNNER_TEMP/cli-release/xcprojgen-1.2.3-macos-universal.tar.gz" \
            --output "$RUNNER_TEMP/xcprojgen.rb"
          ruby -c "$RUNNER_TEMP/xcprojgen.rb"
