name: Examples smoke tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: ${{ matrix.example }}
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: Tool
            script: Scripts/smoke-test.sh
          - example: Workspace
            script: Scripts/workspace-smoke-test.sh
          - example: iOS
            script: Scripts/ios-smoke-test.sh
          - example: Advanced
            script: Scripts/advanced-smoke-test.sh
          - example: MixedWorkspace
            script: Scripts/mixed-workspace-smoke-test.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pkl
        with:
          version: '0.33.0'
      - name: Generate, validate, and build the example
        env:
          SMOKE_SCRIPT: ${{ matrix.script }}
        run: bash "$SMOKE_SCRIPT"
